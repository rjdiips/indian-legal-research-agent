# Postgres 17 with pgvector. tsvector and pg_trgm are built in / contrib.
# Self-hosted Langfuse is not included yet: add it from Langfuse's own compose file when needed.
services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: legal
      POSTGRES_PASSWORD: legal
      POSTGRES_DB: legal
    ports:
      - "5440:5432"
    volumes:
      - ./data/pgdata:/var/lib/postgresql/data  # all app files stay inside the repo
    # Schema comes from `legal-agent migrate`, not initdb, so applied files are tracked.
