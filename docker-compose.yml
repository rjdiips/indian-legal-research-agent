# Postgres 17 with pgvector. tsvector and pg_trgm are built in / contrib.
# Self-hosted Langfuse is not included yet: add it from Langfuse's own compose file when needed.
services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: legal
      POSTGRES_PASSWORD: legal
      POSTGRES_DB: legal
    ports:
      - "5440:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d:ro
volumes:
  pgdata:
